<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Anthology Tag Explorer</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>
  
<header>
  <h1>Anthology Tag Explorer</h1>
  <p>Browse and review proposed anthology tags.</p>
</header>

<section class="controls">
  <input id="search" type="text" placeholder="Search tags...">

  <select id="categoryFilter">
    <option value="">All Categories</option>
  </select>

  <select id="statusFilter">
    <option value="">All Statuses</option>
    <option>Strong Support</option>
    <option>Moderate Support</option>
    <option>Limited Support</option>
    <option>Not Selected</option>
  </select>
</section>

<section id="stats"></section>

<section id="results"></section>

<script src="script.js"></script>
</body>
</html>
